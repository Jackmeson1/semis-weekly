<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" width="960" height="236" role="img" aria-label="流水线：免费数据、15 个指标、7 份信道日志、远中近三份期限日志、综合、网页；三级判断后面都有数字核对，不通过就退回"><style>
svg { --bg: #f4f4f4; --node: #ffffff; --fg: #161616; --fg2: #525252; --fg3: #6f6f6f; --line: #c6c6c6;
  --acc: #0f62fe; --acc-bg: #edf5ff; --ok: #0e6027; --ok-bg: #defbe6; --warn: #684e00; --warn-bg: #fcf4d6;
  --bad: #a2191f; --na: #525252; --na-bg: #e0e0e0; }
@media (prefers-color-scheme: dark) { svg { --bg: #262626; --node: #161616; --fg: #f4f4f4; --fg2: #c6c6c6;
  --fg3: #a8a8a8; --line: #525252; --acc: #78a9ff; --acc-bg: #1c2a44; --ok: #6fdc8c; --ok-bg: #044317;
  --warn: #f1c21b; --warn-bg: #302400; --bad: #ff8389; --na: #c6c6c6; --na-bg: #393939; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font: 13px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.b { font-weight: 600; } .big { font-size: 16px; } .t2 { fill: var(--fg2); font-size: 11.5px; } .t3 { fill: var(--fg3); font-size: 11px; }
.m { font-family: ui-monospace, Consolas, monospace; }
.n { fill: var(--node); stroke: var(--line); } .acc { fill: var(--acc-bg); stroke: var(--acc); stroke-width: 1.5; }
.dim { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
.watch { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.2; } .slack { fill: var(--ok-bg); stroke: var(--ok); stroke-width: 1.2; }
.nabg { fill: var(--na-bg); }
.e { fill: none; stroke: var(--fg3); stroke-width: 1.3; } .dash { stroke-dasharray: 4 3; }
.strong { stroke: var(--bad); stroke-width: 2.4; } .stop { stroke: var(--fg2); stroke-width: 2.5; stroke-linecap: round; }
.ah { fill: var(--fg3); } .ahs { fill: var(--bad); }
.c-ok { fill: var(--ok); } .c-warn { fill: var(--warn); } .c-bad { fill: var(--bad); }
.o-na { fill: none; stroke: var(--na); stroke-width: 1.6; }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="ahs"/></marker></defs><rect class="bg" width="960" height="236" rx="6"/><text x="156" y="46" class="t3" text-anchor="middle">入库</text><text x="318" y="46" class="t3" text-anchor="middle">输入包</text><text x="480" y="46" class="t3" text-anchor="middle">只读下一级</text><text x="642" y="46" class="t3" text-anchor="middle">只读下一级</text><text x="804" y="46" class="t3" text-anchor="middle">渲染</text><rect x="10" y="60" width="130" height="74" class="n"/><text x="75" y="92" class="b" text-anchor="middle">免费数据</text><text x="75" y="114" class="t2" text-anchor="middle">7 个来源，每天抓</text><rect x="172" y="60" width="130" height="74" class="n"/><text x="237" y="92" class="b" text-anchor="middle">15 个指标</text><text x="237" y="114" class="t2" text-anchor="middle">代码算，可复查</text><rect x="334" y="60" width="130" height="74" class="acc"/><text x="399" y="78" class="t3 m" text-anchor="middle">第 1 级</text><text x="399" y="100" class="b" text-anchor="middle">7 份信道日志</text><text x="399" y="120" class="t2" text-anchor="middle">一个 AI 只看一个信道</text><rect x="496" y="60" width="130" height="74" class="acc"/><text x="561" y="78" class="t3 m" text-anchor="middle">第 2 级</text><text x="561" y="100" class="b" text-anchor="middle">远、中、近</text><text x="561" y="120" class="t2" text-anchor="middle">三份期限日志</text><rect x="658" y="60" width="130" height="74" class="acc"/><text x="723" y="78" class="t3 m" text-anchor="middle">第 3 级</text><text x="723" y="100" class="b" text-anchor="middle">综合</text><text x="723" y="120" class="t2" text-anchor="middle">一个动作</text><rect x="820" y="60" width="130" height="74" class="n"/><text x="885" y="92" class="b" text-anchor="middle">网页</text><text x="885" y="114" class="t2" text-anchor="middle">每周一期</text><path d="M140 97H168" class="e" marker-end="url(#a)"/><path d="M302 97H330" class="e" marker-end="url(#a)"/><path d="M464 97H492" class="e" marker-end="url(#a)"/><path d="M626 97H654" class="e" marker-end="url(#a)"/><path d="M788 97H816" class="e" marker-end="url(#a)"/><rect x="334" y="178" width="454" height="38" class="watch"/><text x="561" y="202" class="t2 c-warn b" text-anchor="middle">数字核对：每个数字都要有出处，正文不能有内部编号</text><path d="M399 178V140" class="e dash" marker-end="url(#a)"/><path d="M561 178V140" class="e dash" marker-end="url(#a)"/><path d="M723 178V140" class="e dash" marker-end="url(#a)"/><text x="796" y="202" class="t2">不通过就退回</text></svg>
