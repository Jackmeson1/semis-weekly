<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="960" height="346" role="img" aria-label="四种能推翻方向的情况与各自时长，以及四种推不翻方向的理由"><style>
svg { --bg: #f4f4f4; --node: #ffffff; --fg: #161616; --fg2: #525252; --fg3: #6f6f6f; --line: #c6c6c6;
  --acc: #0f62fe; --acc-bg: #edf5ff; --ok: #0e6027; --ok-bg: #defbe6; --warn: #684e00; --warn-bg: #fcf4d6;
  --bad: #a2191f; --na: #525252; --na-bg: #e0e0e0; }
@media (prefers-color-scheme: dark) { svg { --bg: #262626; --node: #161616; --fg: #f4f4f4; --fg2: #c6c6c6;
  --fg3: #a8a8a8; --line: #525252; --acc: #78a9ff; --acc-bg: #1c2a44; --ok: #6fdc8c; --ok-bg: #044317;
  --warn: #f1c21b; --warn-bg: #302400; --bad: #ff8389; --na: #c6c6c6; --na-bg: #393939; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font: 13px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.b { font-weight: 600; } .big { font-size: 16px; } .t2 { fill: var(--fg2); font-size: 11.5px; } .t3 { fill: var(--fg3); font-size: 11px; }
.m { font-family: ui-monospace, Consolas, monospace; }
.n { fill: var(--node); stroke: var(--line); } .acc { fill: var(--acc-bg); stroke: var(--acc); stroke-width: 1.5; }
.dim { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
.watch { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.2; } .slack { fill: var(--ok-bg); stroke: var(--ok); stroke-width: 1.2; }
.nabg { fill: var(--na-bg); }
.e { fill: none; stroke: var(--fg3); stroke-width: 1.3; } .dash { stroke-dasharray: 4 3; }
.strong { stroke: var(--bad); stroke-width: 2.4; } .stop { stroke: var(--fg2); stroke-width: 2.5; stroke-linecap: round; }
.ah { fill: var(--fg3); } .ahs { fill: var(--bad); }
.c-ok { fill: var(--ok); } .c-warn { fill: var(--warn); } .c-bad { fill: var(--bad); }
.o-na { fill: none; stroke: var(--na); stroke-width: 1.6; }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="ahs"/></marker></defs><rect class="bg" width="960" height="346" rx="6"/><text x="20" y="20" class="b">能推翻方向的</text><text x="940" y="20" class="b" text-anchor="end">推不翻方向的</text><rect x="20" y="36" width="290" height="58" class="n"/><text x="34" y="59" class="b">融资断裂</text><text x="296" y="59" class="b c-bad" text-anchor="end">改变方向</text><text x="34" y="80" class="t2">信用收紧，且云厂花的钱超过赚的钱</text><rect x="20" y="114" width="290" height="58" class="n"/><text x="34" y="137" class="b">利率涨得太快</text><text x="296" y="137" class="b c-warn" text-anchor="end">否决几周</text><text x="34" y="158" class="t2">看速度，不看水平</text><rect x="20" y="192" width="290" height="58" class="n"/><text x="34" y="215" class="b">仓位极端</text><text x="296" y="215" class="b c-warn" text-anchor="end">只改进出时点</text><text x="34" y="236" class="t2">做市商 gamma 为负、波动冲击</text><rect x="20" y="270" width="290" height="58" class="n"/><text x="34" y="293" class="b">政策冲击</text><text x="296" y="293" class="b c-warn" text-anchor="end">到期前有效</text><text x="34" y="314" class="t2">关税、出口管制这类</text><rect x="650" y="36" width="290" height="58" class="n"/><text x="664" y="59" class="b">长端利率的水平</text><text x="664" y="80" class="t2">扎实的资产不怕利率高，只怕涨得快</text><rect x="650" y="114" width="290" height="58" class="n"/><text x="664" y="137" class="b">降息路径</text><text x="664" y="158" class="t2">在每个期限都排最后</text><rect x="650" y="192" width="290" height="58" class="n"/><text x="664" y="215" class="b">泡沫论、崩盘论</text><text x="664" y="236" class="t2">直接忽略</text><rect x="650" y="270" width="290" height="58" class="n"/><text x="664" y="293" class="b">产业里的小延期</text><text x="664" y="314" class="t2">只是时间问题，盯住需求就够了</text><rect x="370" y="146" width="220" height="74" class="acc"/><text x="480" y="178" class="b big" text-anchor="middle">半导体的方向</text><text x="480" y="201" class="t2" text-anchor="middle">前提：AI 需求不会到顶</text><path d="M310 65C350 65 345 158 364 158" class="e strong" marker-end="url(#s)"/><path d="M310 143C345 143 345 175 366 175" class="e" marker-end="url(#a)"/><path d="M310 221C345 221 345 192 366 192" class="e" marker-end="url(#a)"/><path d="M310 299C345 299 345 209 366 209" class="e" marker-end="url(#a)"/><path d="M650 65C615 65 620 158 602 158" class="e dash"/><path d="M650 143C615 143 620 175 602 175" class="e dash"/><path d="M650 221C615 221 620 192 602 192" class="e dash"/><path d="M650 299C615 299 620 209 602 209" class="e dash"/><path class="stop" d="M598 152V164M598 169V181M598 186V198M598 203V215"/></svg>
