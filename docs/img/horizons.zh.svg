<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" width="960" height="326" role="img" aria-label="三个期限各自的排序：近期市场仓位最要紧；中期信用、资金面、产业、AI 需求并列；远期产业、AI 需求、美债供给并列；降息路径都排最后"><style>
svg { --bg: #f4f4f4; --node: #ffffff; --fg: #161616; --fg2: #525252; --fg3: #6f6f6f; --line: #c6c6c6;
  --acc: #0f62fe; --acc-bg: #edf5ff; --ok: #0e6027; --ok-bg: #defbe6; --warn: #684e00; --warn-bg: #fcf4d6;
  --bad: #a2191f; --na: #525252; --na-bg: #e0e0e0; }
@media (prefers-color-scheme: dark) { svg { --bg: #262626; --node: #161616; --fg: #f4f4f4; --fg2: #c6c6c6;
  --fg3: #a8a8a8; --line: #525252; --acc: #78a9ff; --acc-bg: #1c2a44; --ok: #6fdc8c; --ok-bg: #044317;
  --warn: #f1c21b; --warn-bg: #302400; --bad: #ff8389; --na: #c6c6c6; --na-bg: #393939; } }
.bg { fill: var(--bg); }
text { fill: var(--fg); font: 13px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.b { font-weight: 600; } .big { font-size: 16px; } .t2 { fill: var(--fg2); font-size: 11.5px; } .t3 { fill: var(--fg3); font-size: 11px; }
.m { font-family: ui-monospace, Consolas, monospace; }
.n { fill: var(--node); stroke: var(--line); } .acc { fill: var(--acc-bg); stroke: var(--acc); stroke-width: 1.5; }
.dim { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
.watch { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.2; } .slack { fill: var(--ok-bg); stroke: var(--ok); stroke-width: 1.2; }
.nabg { fill: var(--na-bg); }
.e { fill: none; stroke: var(--fg3); stroke-width: 1.3; } .dash { stroke-dasharray: 4 3; }
.strong { stroke: var(--bad); stroke-width: 2.4; } .stop { stroke: var(--fg2); stroke-width: 2.5; stroke-linecap: round; }
.ah { fill: var(--fg3); } .ahs { fill: var(--bad); }
.c-ok { fill: var(--ok); } .c-warn { fill: var(--warn); } .c-bad { fill: var(--bad); }
.o-na { fill: none; stroke: var(--na); stroke-width: 1.6; }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="ahs"/></marker></defs><rect class="bg" width="960" height="326" rx="6"/><text x="20" y="42" class="t2">谁说了算（条越长越要紧）</text><text x="20" y="22" class="b big">近 · 两周以内</text><rect x="20" y="60" width="270" height="30" class="acc"/><text x="32" y="80" class="b">市场仓位</text><rect x="20" y="98" width="150" height="30" class="n"/><text x="32" y="118">利率速度、信用等</text><rect x="20" y="136" width="120" height="30" class="dim"/><text x="32" y="156" class="t2">公司、政策</text><text x="345" y="22" class="b big">中 · 一个财报季</text><rect x="345" y="60" width="250" height="30" class="acc"/><text x="357" y="80" class="b">信用</text><rect x="345" y="98" width="250" height="30" class="acc"/><text x="357" y="118" class="b">资金面</text><rect x="345" y="136" width="250" height="30" class="acc"/><text x="357" y="156" class="b">产业景气</text><rect x="345" y="174" width="250" height="30" class="acc"/><text x="357" y="194" class="b">AI 需求</text><rect x="345" y="212" width="130" height="30" class="dim"/><text x="357" y="232" class="t2">公司财报</text><rect x="345" y="250" width="110" height="30" class="dim"/><text x="357" y="270" class="t2">宏观政策</text><text x="670" y="22" class="b big">远 · 半年以上</text><rect x="670" y="60" width="270" height="30" class="acc"/><text x="682" y="80" class="b">产业</text><rect x="670" y="98" width="270" height="30" class="acc"/><text x="682" y="118" class="b">AI 需求</text><rect x="670" y="136" width="270" height="30" class="acc"/><text x="682" y="156" class="b">美债供给</text><rect x="670" y="174" width="120" height="30" class="dim"/><text x="682" y="194" class="t2">公司、政策</text><line x1="20" y1="296" x2="940" y2="296" class="e dash"/><text x="20" y="314" class="t2">每个期限都排最后：联储的降息路径</text></svg>
