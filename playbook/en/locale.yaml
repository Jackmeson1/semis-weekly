prompt:
  enum_sep: ', '
  horizons:
    near: near
    mid: mid
    far: far
  notes:
    C2: '- S-L1-01 is the signed 5-day change (v0.3): rises are judged against the thresholds, falls are capped
      at watch. For a fall, explain that the meaning depends on the cause; if the packet has no cause, say so.

      - S-L2-01 counts bid-to-cover as weak only when it is at least 0.05 below the prior-6 mean (v0.3). If the
      10-year change on an auction day is null, say it was not judged.'
    C3: '- This channel is low weight (from 2025-11 the author stopped watching the TGA closely). Even binding on
      its own is not enough to call the mid horizon tight.

      - If the reverse repo balance is near zero, explain what an exhausted buffer means.'
    C4: '- history_days for GEX is the number of snapshots. With 1 day you cannot compare with last week; write
      "first snapshot".

      - GEX rests on an assumption about dealer side (customers sell calls, buy puts); the gamma flip is not a fact.
      Say so under Deviations and uncertainty.

      - Add one item: in the repair sequence (gamma -> CTA -> long-only money), which step are we at.'
    C5: '- Monthly revenue and capex are monthly and quarterly data. If nothing new arrived this week, write "carried
      over" with the data date. Company capex quarters do not line up; say so.'
    C6: '- events.earnings_last_21d holds the press release text (text). Take numbers and management statements
      only from that text: revenue, margin, capex guidance, comments on AI demand.

      - For companies not in the packet, write "no results release in the last 21 days"; do not guess dates or results.

      - The channel state says whether results add to, subtract from, or say nothing about the C5 question (cloud
      capex returns, chip demand): adds = slack, subtracts = watch or binding, nothing = na.'
    C7: '- When an FOMC event has a statement, write the decision and wording changes from the statement text; also
      give the most recent decision as background. If a meeting has ended with no statement and no user note, write
      "result pending"; do not guess.

      - List FOMC meetings in the next 60 days (mark the one with projections) and Treasury auctions in the next
      14 days.

      - The channel state says whether a policy shock is in force: none = slack; in force but before expiry = watch;
      just appeared = binding.'
