# Signal definitions. Code computes value and state from these; models never compute numbers.
# state: slack (not binding) / watch (near) / binding / na (no data)
# basis: author = a number the author used; inferred = derived from the author's logic;
#        added = added during research, needs calibration
# Thresholds are 2024–2026 magnitudes. The calibration log is where they get revised.
# name / note are English; another language can replace them in playbook/<lang>/locale.yaml (names).

version: 0.3
# Change log
#   0.3 (2026-10-28) S-L1-01 is directional: falls are capped at watch. S-L2-01 weak bid-to-cover also needs
#        a gap of at least 0.05 below the prior-6 mean. Reason: the first issue's C2 log showed the old rules
#        misfiring on a falling 10-year and on auctions with tiny prior variance. Changed with user approval.

# Channel grouping. Level 1 judges each channel separately; a channel reads only its own signals.
# horizons: which horizons the channel log has to speak to.
channels:
  C1: {name: Credit,             horizons: [mid, far],  signals: [S-L3-01, S-L3-02, S-L3-03],
       archive: [ccc_oas]}
  C2: {name: Rates,              horizons: [near, mid], signals: [S-L1-01, S-L1-02, S-L1-03, S-L2-01],
       archive: [tlt_iv30, ust2y, payrolls, unemployment, cpi, core_cpi, core_pce]}
  C3: {name: Liquidity plumbing, horizons: [mid],       signals: [S-L2-02], weight: low,
       archive: [reserves, sofr, iorb, nfci]}
  C4: {name: Positioning,        horizons: [near, mid], signals: [S-L4-01, S-L4-02, S-L4-03, S-L4-04],
       archive: [vix3m, sox, spx]}
  C5: {name: Industry,           horizons: [far],       signals: [S-L5-01, S-L5-02, S-L5-03]}
  C6: {name: Company results,    horizons: [mid],       signals: [], inputs: [earnings]}
  C7: {name: Policy and events,  horizons: [mid],       signals: [], inputs: [fomc, auctions_upcoming],
       archive: [brent, usdjpy]}

signals:

  # ---------- step 1: credit ----------
  - id: S-L3-01
    name: High-yield spread, 20-day change
    layer: L3.credit
    inputs: [hy_oas]
    compute: (hy_oas[t] - hy_oas[t-20]) * 100        # bp
    thresholds: {watch: 40, binding: 75}
    basis: added
    note: The author gave no spread threshold, only that nothing else matters once credit stops absorbing issuance. Magnitudes for now; calibration will fix them.
  - id: S-L3-02
    name: Investment-grade spread, 20-day change
    layer: L3.credit
    inputs: [ig_oas]
    compute: (ig_oas[t] - ig_oas[t-20]) * 100
    thresholds: {watch: 12, binding: 25}
    basis: added
  - id: S-L3-03
    name: Cloud capex / operating cash flow (last 4 quarters, 5 companies)
    layer: L3.credit
    inputs: [csp_capex, csp_ocf]
    compute: sum4q(csp_capex) / sum4q(csp_ocf)
    thresholds: {watch: 0.8, binding: 1.0}           # 1.0 = free cash flow turns negative; capex needs outside money
    basis: inferred
    rules: [INF-02, VETO-01]

  # ---------- step 2: rate speed ----------
  - id: S-L1-01
    name: 10-year yield, 5-day change (directional)
    layer: L1.long_end
    inputs: [ust10y]
    compute: (ust10y[t] - ust10y[t-5]) * 100          # signed, bp
    thresholds: {watch: 12, binding: 20}
    direction: rises use watch/binding; falls are capped at watch (from v0.3)
    basis: author
    note: The author's alarm line is about rises (2024-05, about +20bp in 5 days). Fast falls matter too, but their meaning depends on the cause (rate-cut pricing, weaker growth, flight to safety); the log has to say which.
  - id: S-L1-02
    name: 10-year daily change, 20-day standard deviation (realized proxy for swaption vol)
    layer: L1.long_end
    inputs: [ust10y]
    compute: std(diff(ust10y) * 100, 20)             # bp/day
    thresholds: {watch: pct75_3y, binding: pct90_3y}  # relative to the past 3 years
    basis: added
    note: The author watches 3m10y swaption implied vol (about 6.2bp/day at the 2026-10 high). We cannot get it, so realized vol stands in; the two are not the same measure.
  - id: S-L1-03
    name: 2s10s curve, 20-day change
    layer: L1.long_end
    inputs: [ust2s10s]
    compute: (ust2s10s[t] - ust2s10s[t-20]) * 100
    thresholds: {watch: 25, binding: null}           # a prompt only; never binding on its own
    basis: added
  - id: S-L2-01
    name: Weak coupon auctions this week
    layer: L2.treasury_issuance
    inputs: [auctions, ust10y]
    compute: |
      for each 2/5/7/10/20/30-year auction this week:
        weak = bid-to-cover < prior-6 mean - 1 std, and at least 0.05 below the mean (from v0.3)
        jump = the 10-year rises >= 5bp on the auction day
      binding: any auction weak and jump; watch: any auction weak or jump
    basis: author (5bp) + added (bid-to-cover measure)
    note: The author's auction tail needs the when-issued yield, which free data does not have; this is an approximation.
  - id: S-L2-02
    name: Fed net liquidity, 4-week change (assets - TGA - reverse repo)
    layer: L2.qt_balance_sheet
    inputs: [fed_assets, tga, on_rrp]
    compute: netliq[t] - netliq[t-4w]                # $bn
    thresholds: {watch: -150, binding: -300}
    basis: added
    note: The author used this measure often in 2024; from 2025-11 they no longer watched the TGA closely, so it weighs less than credit and rate speed.

  # ---------- step 3: positioning ----------
  - id: S-L4-01
    name: Suppressed volatility (fragility)
    layer: L4.dealer_gamma
    inputs: [vix]
    compute: pct_3y(vix[t])
    thresholds: {watch: 15}                          # VIX below its 15th percentile of the past 3 years
    basis: inferred
    note: Watch only, never binding. Low volatility is not a sell signal; it means the market has little room for a shock.
  - id: S-L4-02
    name: Volatility shock
    layer: L4.dealer_gamma
    inputs: [vix]
    compute: level vix[t] and 5-day change vix[t] - vix[t-5], each against its own line; the worse state wins
    thresholds: {watch: "vix>=20 or +4 in 5 days", binding: "vix>=25 or +6 in 5 days"}
    basis: added
  - id: S-L4-03
    name: Net GEX and distance to gamma flip (SPY + QQQ)
    layer: L4.dealer_gamma
    inputs: [gex, gex_flip, gex_spot]
    compute: |
      net = SPY net GEX + QQQ net GEX; flip = the price where net GEX changes sign (each ticker)
      binding: net < 0 (negative gamma amplifies moves)
      watch: SPY or QQQ within 1.5% of its flip
    basis: inferred + added
    note: "Dealer side is an assumption (public convention: customers sell calls and buy puts, so dealers are long call gamma and short put gamma); paid products estimate it too. SMH is shown but not used in the state."
  - id: S-L4-04
    name: CFTC leveraged-fund net equity-index futures, percentile (S&P 500 + Nasdaq-100, consolidated)
    layer: L4.hf_leverage
    inputs: [cftc_net]
    compute: pct_3y(long - short)
    thresholds: {watch_low: 10, watch_high: 90}
    basis: inferred
    note: Low percentile = crowded short, which the author reads as making a deep fall unlikely (a release signal); high = crowded long. Weekly, 3-day lag. Watch in 19 of 26 backfilled weeks, so it discriminates poorly; due for calibration.

  # ---------- step 4: the industry exam ----------
  - id: S-L5-01
    name: TSMC monthly revenue, 3-month rolling YoY
    layer: L5.supply_capacity
    inputs: [tsmc_rev]
    compute: yoy(sum3m(tsmc_rev))
    thresholds: {watch: "2 consecutive monthly declines"}
    basis: added
  - id: S-L5-02
    name: Taiwan AI-server supply chain monthly revenue, 3-month rolling YoY (6 companies)
    layer: L5.csp_capex
    inputs: [tw_ai_chain_rev]
    compute: yoy(sum3m(sum_entities(tw_ai_chain_rev)))
    thresholds: {watch: "2 consecutive monthly declines"}
    basis: added
  - id: S-L5-03
    name: Cloud capex YoY (latest quarter, 5 companies)
    layer: L5.csp_capex
    inputs: [csp_capex]
    compute: yoy(sum_entities(csp_capex))
    thresholds: {watch: 10}                          # YoY below +10%
    basis: added
    rules: [INV-01]
