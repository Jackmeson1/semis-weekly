# Signal definitions. Code computes value and state from these; models never compute numbers.
# state: slack (not binding) / watch (near) / binding / na (no data)
# basis: 作者 (author) = a number the author used; 推断 (inferred) = derived from the author's logic;
#        补充 (added) = added during research, needs calibration
# Thresholds are 2024–2026 magnitudes. The calibration log is where they get revised.
# name / note are Chinese; name_en / note_en are English. The report language picks one.

version: 0.3
# Change log
#   0.3 (2026-10-28) S-L1-01 is directional: falls are capped at watch. S-L2-01 weak bid-to-cover also needs
#        a gap of at least 0.05 below the prior-6 mean. Reason: the first issue's C2 log showed the old rules
#        misfiring on a falling 10-year and on auctions with tiny prior variance. Changed with user approval.

# Channel grouping. Level 1 judges each channel separately; a channel reads only its own signals.
# horizons: which horizons the channel log has to speak to.
channels:
  C1: {name: 信用,       name_en: Credit,             horizons: [mid, far],  signals: [S-L3-01, S-L3-02, S-L3-03]}
  C2: {name: 利率,       name_en: Rates,              horizons: [near, mid], signals: [S-L1-01, S-L1-02, S-L1-03, S-L2-01],
       archive: [tlt_iv30]}
  C3: {name: 流动性管道, name_en: Liquidity plumbing, horizons: [mid],       signals: [S-L2-02], weight: low}
  C4: {name: 仓位,       name_en: Positioning,        horizons: [near],      signals: [S-L4-01, S-L4-02, S-L4-03, S-L4-04]}
  C5: {name: 产业,       name_en: Industry,           horizons: [far],       signals: [S-L5-01, S-L5-02, S-L5-03]}
  C6: {name: 公司与财报, name_en: Company results,    horizons: [mid],       signals: [], inputs: [earnings]}
  C7: {name: 政策与事件, name_en: Policy and events,  horizons: [mid],       signals: [], inputs: [fomc, auctions_upcoming]}

signals:

  # ---------- step 1: credit ----------
  - id: S-L3-01
    name: 高收益利差 20 个交易日变化
    name_en: High-yield spread, 20-day change
    layer: L3.credit
    inputs: [hy_oas]
    compute: (hy_oas[t] - hy_oas[t-20]) * 100        # bp
    thresholds: {watch: 40, binding: 75}
    basis: 补充
    note: 作者没给利差阈值，只说信用市场接不住融资时其他都不重要。先用量级，靠校准修正。
    note_en: The author gave no spread threshold, only that nothing else matters once credit stops absorbing issuance. Magnitudes for now; calibration will fix them.
  - id: S-L3-02
    name: 投资级利差 20 个交易日变化
    name_en: Investment-grade spread, 20-day change
    layer: L3.credit
    inputs: [ig_oas]
    compute: (ig_oas[t] - ig_oas[t-20]) * 100
    thresholds: {watch: 12, binding: 25}
    basis: 补充
  - id: S-L3-03
    name: 云厂 capex 占经营现金流比例（最近 4 季合计，5 家加总）
    name_en: Cloud capex / operating cash flow (last 4 quarters, 5 companies)
    layer: L3.credit
    inputs: [csp_capex, csp_ocf]
    compute: sum4q(csp_capex) / sum4q(csp_ocf)
    thresholds: {watch: 0.8, binding: 1.0}           # 1.0 = free cash flow turns negative; capex needs outside money
    basis: 推断
    rules: [INF-02, VETO-01]

  # ---------- step 2: rate speed ----------
  - id: S-L1-01
    name: 10 年期 5 个交易日变化（分方向）
    name_en: 10-year yield, 5-day change (directional)
    layer: L1.long_end
    inputs: [ust10y]
    compute: (ust10y[t] - ust10y[t-5]) * 100          # signed, bp
    thresholds: {watch: 12, binding: 20}
    direction: rises use watch/binding; falls are capped at watch (from v0.3)
    basis: 作者
    note: 作者的警戒线说的是上涨（2024-05：5 天上涨约 20bp）。快速下跌也要看，但含义取决于原因（降息预期、增长转弱、避险），由日志说明。
    note_en: The author's alarm line is about rises (2024-05, about +20bp in 5 days). Fast falls matter too, but their meaning depends on the cause (rate-cut pricing, weaker growth, flight to safety); the log has to say which.
  - id: S-L1-02
    name: 10 年期日变化的 20 日标准差（swaption vol 的已实现代理）
    name_en: 10-year daily change, 20-day standard deviation (realized proxy for swaption vol)
    layer: L1.long_end
    inputs: [ust10y]
    compute: std(diff(ust10y) * 100, 20)             # bp/day
    thresholds: {watch: pct75_3y, binding: pct90_3y}  # relative to the past 3 years
    basis: 补充
    note: 作者看的是 3m10y swaption 隐含波动（2026-10 高点约 6.2bp/天），我们拿不到，用已实现波动代替，口径不同。
    note_en: The author watches 3m10y swaption implied vol (about 6.2bp/day at the 2026-10 high). We cannot get it, so realized vol stands in; the two are not the same measure.
  - id: S-L1-03
    name: 2s10s 20 个交易日变化
    name_en: 2s10s curve, 20-day change
    layer: L1.long_end
    inputs: [ust2s10s]
    compute: (ust2s10s[t] - ust2s10s[t-20]) * 100
    thresholds: {watch: 25, binding: null}           # a prompt only; never binding on its own
    basis: 补充
  - id: S-L2-01
    name: 本周 coupon 拍卖是否走弱
    name_en: Weak coupon auctions this week
    layer: L2.treasury_issuance
    inputs: [auctions, ust10y]
    compute: |
      for each 2/5/7/10/20/30-year auction this week:
        weak = bid-to-cover < prior-6 mean - 1 std, and at least 0.05 below the mean (from v0.3)
        jump = the 10-year rises >= 5bp on the auction day
      binding: any auction weak and jump; watch: any auction weak or jump
    basis: 作者（5bp）+ 补充（认购倍数口径）
    note: 作者说的拍卖尾部需要 when-issued 收益率，免费数据没有，这里是近似。
    note_en: The author's auction tail needs the when-issued yield, which free data does not have; this is an approximation.
  - id: S-L2-02
    name: 联储净流动性 4 周变化（资产 - TGA - 逆回购）
    name_en: Fed net liquidity, 4-week change (assets - TGA - reverse repo)
    layer: L2.qt_balance_sheet
    inputs: [fed_assets, tga, on_rrp]
    compute: netliq[t] - netliq[t-4w]                # $bn
    thresholds: {watch: -150, binding: -300}
    basis: 补充
    note: 作者 2024 年常用这个口径；2025-11 起认为不必再盯 TGA，所以权重低于信用和利率速度。
    note_en: The author used this measure often in 2024; from 2025-11 they no longer watched the TGA closely, so it weighs less than credit and rate speed.

  # ---------- step 3: positioning ----------
  - id: S-L4-01
    name: 波动压抑（脆弱）
    name_en: Suppressed volatility (fragility)
    layer: L4.dealer_gamma
    inputs: [vix]
    compute: pct_3y(vix[t])
    thresholds: {watch: 15}                          # VIX below its 15th percentile of the past 3 years
    basis: 推断
    note: 只给 watch，不判 binding。低波动本身不是卖出信号，说明市场容错低。
    note_en: Watch only, never binding. Low volatility is not a sell signal; it means the market has little room for a shock.
  - id: S-L4-02
    name: 波动冲击
    name_en: Volatility shock
    layer: L4.dealer_gamma
    inputs: [vix]
    compute: max(vix[t], vix[t] - vix[t-5])
    thresholds: {watch: "vix>=20 or +4 in 5 days", binding: "vix>=25 or +6 in 5 days"}
    basis: 补充
  - id: S-L4-03
    name: 净 GEX 和 gamma flip 距离（SPY + QQQ）
    name_en: Net GEX and distance to gamma flip (SPY + QQQ)
    layer: L4.dealer_gamma
    inputs: [gex, gex_flip, gex_spot]
    compute: |
      net = SPY net GEX + QQQ net GEX; flip = the price where net GEX changes sign (each ticker)
      binding: net < 0 (negative gamma amplifies moves)
      watch: SPY or QQQ within 1.5% of its flip
    basis: 推断 + 补充
    note: 做市商方向是假设（公开约定：客户卖 call、买 put，做市商 call gamma 为正、put gamma 为负），付费产品也是估的。SMH 只展示，不进判定。
    note_en: "Dealer side is an assumption (public convention: customers sell calls and buy puts, so dealers are long call gamma and short put gamma); paid products estimate it too. SMH is shown but not used in the state."
  - id: S-L4-04
    name: CFTC 杠杆基金股指期货净头寸分位（S&P 500 + 纳指 100，合并口径）
    name_en: CFTC leveraged-fund net equity-index futures, percentile (S&P 500 + Nasdaq-100, consolidated)
    layer: L4.hf_leverage
    inputs: [cftc_net]
    compute: pct_3y(long - short)
    thresholds: {watch_low: 10, watch_high: 90}
    basis: 推断
    note: 低分位 = 空头拥挤，作者认为这时美股难大跌（放行信号）；高分位 = 多头拥挤。周度、滞后 3 天。回补的 26 周里有 19 周是 watch，区分度低，待校准。
    note_en: Low percentile = crowded short, which the author reads as making a deep fall unlikely (a release signal); high = crowded long. Weekly, 3-day lag. Watch in 19 of 26 backfilled weeks, so it discriminates poorly; due for calibration.

  # ---------- step 4: the industry exam ----------
  - id: S-L5-01
    name: 台积电月营收 3 个月滚动同比
    name_en: TSMC monthly revenue, 3-month rolling YoY
    layer: L5.supply_capacity
    inputs: [tsmc_rev]
    compute: yoy(sum3m(tsmc_rev))
    thresholds: {watch: "2 consecutive monthly declines"}
    basis: 补充
  - id: S-L5-02
    name: 台湾 AI 服务器链月营收 3 个月滚动同比（6 家加总）
    name_en: Taiwan AI-server supply chain monthly revenue, 3-month rolling YoY (6 companies)
    layer: L5.csp_capex
    inputs: [tw_ai_chain_rev]
    compute: yoy(sum3m(sum_entities(tw_ai_chain_rev)))
    thresholds: {watch: "2 consecutive monthly declines"}
    basis: 补充
  - id: S-L5-03
    name: 云厂 capex 合计同比（最新一季，5 家）
    name_en: Cloud capex YoY (latest quarter, 5 companies)
    layer: L5.csp_capex
    inputs: [csp_capex]
    compute: yoy(sum_entities(csp_capex))
    thresholds: {watch: 10}                          # YoY below +10%
    basis: 补充
    rules: [INV-01]
